   <g id="text_1">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203a36" x="29.52" y="83.359646" transform="rotate(-0 29.52 83.359646)">1  Strong enough?</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #203a36" transform="translate(29.52 117.513566)">At most 5 mapped points</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #203a36" transform="translate(29.52 132.813566)">lost; resulting score</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #203a36" transform="translate(29.52 148.113566)">at least −1.00 pawns.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #60726d" x="186.6528" y="123.215244" transform="rotate(-0 186.6528 123.215244)">→</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203a36" x="206.2944" y="83.359646" transform="rotate(-0 206.2944 83.359646)">2  A legal piece offer?</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #203a36" transform="translate(206.2944 117.423519)">Captures on one square</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #203a36" transform="translate(206.2944 132.813566)">beat immediate gains</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #203a36" transform="translate(206.2944 148.113566)">plus the material margin.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #60726d" x="363.4272" y="123.215244" transform="rotate(-0 363.4272 123.215244)">→</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203a36" x="383.0688" y="83.359646" transform="rotate(-0 383.0688 83.359646)">3  Material agrees?</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #203a36" transform="translate(383.0688 118.501691)">En Croissant’s material</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #203a36" transform="translate(383.0688 132.813566)">check agrees, OR the mover</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #203a36" transform="translate(383.0688 148.113566)">has an explicit winning mate.</text>
   </g>
   <g id="text_9">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #60726d" x="540.2016" y="123.215244" transform="rotate(-0 540.2016 123.215244)">→</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203a36" x="559.8432" y="83.359646" transform="rotate(-0 559.8432 83.359646)">4  Offer matters?</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #203a36" transform="translate(559.8432 118.501691)">Other checked moves</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #203a36" transform="translate(559.8432 133.801691)">without an offer don’t</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #203a36" transform="translate(559.8432 148.113566)">already win comfortably.</text>
   </g>
   <g id="text_12">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #60726d" x="716.976" y="123.215244" transform="rotate(-0 716.976 123.215244)">→</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203a36" x="736.6176" y="83.359646" transform="rotate(-0 736.6176 83.359646)">5  Checks agree?</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #203a36" transform="translate(736.6176 116.525441)">Complete analysis windows</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #203a36" transform="translate(736.6176 132.293207)">corroborate the award;</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #203a36" transform="translate(736.6176 148.113566)">otherwise withhold it.</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203a36" x="20.592" y="24.676406" transform="rotate(-0 20.592 24.676406)">How Mute’s open Brilliant rule works</text>
   </g>
   <g id="text_16">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #60726d" x="20.592" y="207.808586" transform="rotate(-0 20.592 207.808586)">All five checks must pass. At least two candidate moves must be evaluated; exact formulas are in the methods.</text>
   </g>
  </g>
